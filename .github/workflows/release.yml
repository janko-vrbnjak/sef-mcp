name: Release

# Push a tag vX.Y.Z → test, build the Claude extension (.mcpb) and skills plugin (.plugin),
# publish a GitHub Release, then list that release in the official MCP Registry.
# The user guide links to releases/latest/download/<stable name>.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tag must match package and plugin versions
        run: |
          V="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$V" || { echo "package.json version != $V"; exit 1; }
          test "$(node -p "require('./plugins/sef-fakture/.claude-plugin/plugin.json').version")" = "$V" || { echo "plugin.json version != $V"; exit 1; }
          test "$(node -p "require('./server.json').version")" = "$V" || { echo "server.json version != $V"; exit 1; }
          test -f "docs/releases/${GITHUB_REF_NAME}.md" || { echo "missing docs/releases/${GITHUB_REF_NAME}.md"; exit 1; }

      - run: npm test
      - run: npm run pack:mcpb
      - run: npm run pack:plugin

      - name: Checksums and release notes
        run: |
          V="${GITHUB_REF_NAME#v}"
          cd dist && sha256sum sef-mcp.mcpb sef-fakture.plugin "sef-mcp-$V.mcpb" "sef-fakture-$V.plugin" > SHA256SUMS.txt && cd ..
          {
            cat "docs/releases/${GITHUB_REF_NAME}.md"
            printf '\n---\n\n## Tehničke izmene (CHANGELOG)\n\n'
            awk -v h="## [$V]" 'index($0, h) == 1 { f = 1; next } f && /^## \[/ { exit } f' CHANGELOG.md
          } > notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --title "sef-mcp $V" --notes-file notes.md --verify-tag \
            dist/sef-mcp.mcpb dist/sef-fakture.plugin "dist/sef-mcp-$V.mcpb" "dist/sef-fakture-$V.plugin" dist/SHA256SUMS.txt

  # Official MCP Registry (https://registry.modelcontextprotocol.io), name io.github.janko-vrbnjak/sef-mcp.
  # Separate job: no write access to the repository, only an OIDC token for the registry.
  # Runs after the release because the registry checks that the .mcpb URL is reachable.
  # Skip with repository variable MCP_REGISTRY_PUBLISH=false.
  mcp-registry:
    needs: release
    if: vars.MCP_REGISTRY_PUBLISH != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the released extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern sef-mcp.mcpb --dir release-asset

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install mcp-publisher (pinned, signature verified)
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl -fsSLO "$base/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "$base/mcp-publisher_linux_amd64.tar.gz.sigstore.json"
          cosign verify-blob mcp-publisher_linux_amd64.tar.gz \
            --bundle mcp-publisher_linux_amd64.tar.gz.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION"
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher

      - name: server.json with the hash of the released file
        run: node scripts/registry-server-json.mjs release-asset/sef-mcp.mcpb build/server.json

      - name: Validate
        run: ./mcp-publisher validate build/server.json

      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish build/server.json
